dataset_root: /run/media/ahmad-pervaiz/New Volume/BC_detection_Project/FINAL DATASET
train_image_dir: Train
train_mask_dir: Train_masks
valid_image_dir: valid
valid_mask_dir: valid_masks
test_image_dir: test
train_patients:
- P1-Shukran-S4
- P2-Mumtaz-S2
- P2-Parveen-S4
- P3-Zareena-S2
- P5-Kousar-S4
valid_patients:
- P1-Ruqayya
- P3-Rabia-S4
valid_extra_groups:
- Tumors
manifest_csv: data/manifest.csv
image_size: 256
in_channels: 1
mask_interpolation: nearest
image_interpolation: bilinear
preserve_aspect_ratio: true
augmentation:
  enabled: true
  rotate_degrees: 10
  translate_percent: 0.05
  scale_range:
  - 0.95
  - 1.05
  brightness_limit: 0.1
  contrast_limit: 0.1
  horizontal_flip: false
model:
  name: unet
  in_channels: 1
  out_channels: 1
  base_features: 32
  depth: 4
batch_size: 4
num_workers: 2
learning_rate: 0.0001
weight_decay: 1.0e-05
epochs: 50
seed: 42
dice_weight: 1.0
bce_weight: 1.0
lr_scheduler:
  name: reduce_on_plateau
  patience: 5
  factor: 0.5
  min_lr: 1.0e-07
early_stopping:
  enabled: true
  patience: 15
  metric: val_dice
threshold: 0.6
min_tumor_area_px: 20
postprocess:
  remove_small_components: true
  min_component_area_px: 100
checkpoint_dir: runs/segmentation/checkpoints
log_dir: runs/segmentation/logs
plot_dir: runs/segmentation/plots
prediction_dir: runs/segmentation/predictions
test_prediction_dir: runs/segmentation/test_predictions
use_amp: true
clearml:
  enabled: false
  project_name: Breast Tumor Segmentation
  task_name: null
